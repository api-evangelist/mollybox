name: MollyBox
description: >-
  MollyBox was added to the API Evangelist network as a consumer-sector portfolio
  lead of DCM Ventures. The domain mollybox.cn currently serves a live "Arcflow
  API" (v0.1.0) — a single-user, self-hosted resource-capture service built on
  FastAPI/uvicorn. It captures URL resources (auto-classified as github, x, wechat,
  or web), enriches their metadata, and tracks each item through a learning
  workflow (inbox, next, doing, done, archived), plus health and identity checks.
  All operations except the public health endpoint require an HTTP Bearer token.
  This profile reflects the real API discovered at the domain during enrichment.
