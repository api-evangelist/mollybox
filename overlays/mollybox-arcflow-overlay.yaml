overlay: 1.0.0
info:
  title: API Evangelist enhancements for Arcflow API (MollyBox)
  version: 1.0.0
extends: openapi/mollybox-arcflow-openapi.json
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-20'
      x-apievangelist-note: >-
        Captured from the live server at http://www.mollybox.cn/openapi.json
        (FastAPI/uvicorn). The domain mollybox.cn currently serves this
        single-user, self-hosted "Arcflow API" resource-capture service.
      x-api-provider: MollyBox
  - target: $.info
    update:
      x-authentication: authentication/mollybox-authentication.yml
      x-conventions: conventions/mollybox-conventions.yml
      x-error-catalog: errors/mollybox-problem-types.yml
      x-data-model: data-model/mollybox-data-model.yml
  - target: $.paths['/api/resources'].get
    update:
      x-apievangelist-note: >-
        Returns an unbounded array; no pagination parameters are declared.
        Filtering only, via q / status / source_type query params.
